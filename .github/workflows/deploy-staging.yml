name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: client-app-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # only staging branch may deploy to staging server
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vite.config.ts writes dist/version.json from VITE_APP_BUILD_ID
      - name: Build
        run: |
          set -euo pipefail
          pnpm run build:skip-check
          test -f dist/version.json
          cat dist/version.json
        env:
          VITE_API_URL: https://api-staging.sesifoto.my
          VITE_APP_BUILD_ID: ${{ github.sha }}

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret SSH_KEY is empty."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if grep -qE '^ssh-(rsa|ed25519|ecdsa|dss) ' ~/.ssh/deploy_key; then
            echo "::error::SSH_KEY looks like a PUBLIC key. Put the private key in SSH_KEY."
            exit 1
          fi
          if ! grep -qE '^-----BEGIN (OPENSSH PRIVATE KEY|RSA PRIVATE KEY|EC PRIVATE KEY|DSA PRIVATE KEY|PRIVATE KEY)-----' ~/.ssh/deploy_key; then
            echo "::error::SSH_KEY must be a PEM/OpenSSH private key."
            exit 1
          fi

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Clean remote + rsync dist to staging
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${REMOTE_PATH:-}" ]; then
            echo "::error::Repository variable REMOTE_PATH is not set (client app staging site folder on the server)."
            exit 1
          fi
          DEPLOY_KEY="${HOME}/.ssh/deploy_key"
          SSH_OPTS="-i ${DEPLOY_KEY} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o PasswordAuthentication=no -o PreferredAuthentications=publickey -o ConnectTimeout=30"

          # Nginx root is .../dist — deploy build there.
          # Also drop old source leftovers at project root (keep dist + .well-known).
          ssh ${SSH_OPTS} "${SSH_USER}@${SSH_HOST}" bash -s <<EOF
          set -euo pipefail
          mkdir -p '${REMOTE_PATH}/dist'
          shopt -s nullglob dotglob
          for item in '${REMOTE_PATH}'/* '${REMOTE_PATH}'/.[!.]* '${REMOTE_PATH}'/..?*; do
            [ -e "\$item" ] || continue
            base=\$(basename "\$item")
            case "\$base" in
              .|..) continue ;;
              dist|.well-known) continue ;;
              *)
                echo "Removing leftover: \$base"
                rm -rf -- "\$item"
                ;;
            esac
          done
          shopt -u nullglob dotglob
          EOF

          rsync -avz --delete \
            -e "ssh ${SSH_OPTS}" \
            ./dist/ \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/dist/"
